version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: contractor_db
    environment:
      POSTGRES_USER: contractor_user
      POSTGRES_PASSWORD: contractor_password_dev
      POSTGRES_DB: contractor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractor_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: contractor_api
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: contractor_user
      DB_PASSWORD: contractor_password_dev
      DB_NAME: contractor_db
      JWT_SECRET: dev_secret_key_change_in_production
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
    command: npm run start:dev

volumes:
  postgres_data:
